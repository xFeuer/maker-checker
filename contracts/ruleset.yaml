# The rules that every specification in this directory has to keep. See ADR 0009.
#
# The format is the one of Spectral, and vacuum reads it. Under the name "spectral:oas", vacuum loads its own rules
# for OpenAPI. "recommended" is the set that it recommends.
#
# A specification is clean when vacuum reports nothing, at any level. A rule that does not fit is switched off
# under "rules", with the reason next to it.
extends: [[spectral:oas, recommended]]

# The conventions of README.md, as far as a linter can check them. Each rule has a document that breaks it, in
# ruleset-tests/.
rules:
  # ADR 0010
  error-responses-are-problems:
    description: An error response is a problem document, with the media type application/problem+json.
    severity: error
    given: "$.paths[*][*].responses[?(@property.match(/^([45]|default)/))].content[*]~"
    then:
      function: enumeration
      functionOptions:
        values:
          - application/problem+json
  operations-have-a-default-response:
    description: An operation has a default response, for what no other response covers.
    severity: error
    given: "$.paths[*][get,put,post,delete].responses"
    then:
      field: default
      function: defined

  # ADR 0011
  no-number-type:
    description: No schema has the type number. A decimal value is a string, and a whole number is an integer.
    severity: error
    given: "$..type"
    then:
      function: schema
      functionOptions:
        schema:
          not:
            anyOf:
              - const: number
              - type: array
                contains:
                  const: number

  # ADR 0012
  post-takes-an-idempotency-key:
    description: A POST takes a required Idempotency-Key header.
    severity: error
    given: "$.paths[*].post"
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            required: [name, in, required]
            properties:
              name:
                const: Idempotency-Key
              in:
                const: header
              required:
                const: true
  no-patch:
    description: No operation is a PATCH. A change is a POST, a PUT or a DELETE.
    severity: error
    given: "$.paths[*]"
    then:
      field: patch
      function: undefined

  # README.md
  paths-start-with-a-version:
    description: A path starts with the version of the API, such as /v1. The path of a hook has /hooks before it.
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^(/hooks)?/v[1-9][0-9]*/"
  operation-ids-in-camel-case:
    description: An operationId is in camelCase.
    severity: error
    given: "$.paths[*][get,put,post,delete].operationId"
    then:
      function: casing
      functionOptions:
        type: camel
  enum-values-in-upper-snake-case:
    description: An enum value is in UPPER_SNAKE_CASE.
    severity: error
    given: "$..enum[*]"
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$"
  objects-are-closed:
    description: An object declares every property that it can have, with additionalProperties set to false.
    severity: error
    given: "$..[?(@.type == 'object')]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [additionalProperties]
          properties:
            additionalProperties:
              const: false
  no-null-type:
    description: No schema has the type null. A property without a value is absent.
    severity: error
    given: "$..type"
    then:
      function: schema
      functionOptions:
        schema:
          not:
            anyOf:
              - const: "null"
              - type: array
                contains:
                  const: "null"
  sensitive-marker-is-true:
    description: A sensitive field is marked with x-sensitive set to true. Any other field has no such marker.
    severity: error
    given: "$..['x-sensitive']"
    then:
      function: schema
      functionOptions:
        schema:
          const: true

  # ADR 0013
  operations-state-who-may-call:
    description: An operation states who may call it, in a security block of its own. An empty block means anybody.
    severity: error
    given: "$.paths[*][get,put,post,delete]"
    then:
      field: security
      function: defined
  security-names-a-scope:
    description: A security requirement names a scheme, and at least one scope for it.
    severity: error
    given: "$.paths[*][get,put,post,delete].security[*]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          minProperties: 1
          additionalProperties:
            type: array
            minItems: 1
  scopes-are-known:
    description: A scope is one of this list. A contract that needs a new scope adds it here and to README.md.
    severity: error
    given: "$.paths[*][get,put,post,delete].security[*][*][*]"
    then:
      function: enumeration
      functionOptions:
        values:
          - accounts:read
          - payments:read
          - payments:create
          - payments:cancel
          - payments:decide
          - hooks:use
  operations-with-a-token-have-401-and-403:
    description: An operation that needs a token has a 401 response and a 403 response.
    severity: error
    given: "$.paths[*][get,put,post,delete]"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            required: [security]
            properties:
              security:
                minItems: 1
          then:
            required: [responses]
            properties:
              responses:
                required: ["401", "403"]

  # ADR 0014
  hooks-need-the-hooks-scope:
    description: An operation under /hooks needs a token with the scope hooks:use.
    severity: error
    given: "$.paths[?(@property.match(/^\\/hooks\\//))][get,put,post,delete]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [security]
          properties:
            security:
              type: array
              minItems: 1
              items:
                type: object
                minProperties: 1
                additionalProperties:
                  type: array
                  contains:
                    const: hooks:use
  only-hooks-take-the-hooks-scope:
    description: The scope hooks:use opens a hook and nothing else.
    severity: error
    given: "$.paths[?(@property.match(/^\\/v[1-9]/))][get,put,post,delete].security[*][*][*]"
    then:
      function: pattern
      functionOptions:
        notMatch: "^hooks:use$"
