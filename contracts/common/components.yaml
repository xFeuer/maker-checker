openapi: 3.1.2

info:
  title: Shared components
  summary: The parts that every specification of the maker-checker platform shares.
  description: >-
    A specification refers to these parts and does not copy them. They hold
    what the conventions of the contracts fix for every service: the access
    token, the problem document, money and balances, the pages of a list, the
    idempotency key, the correlation ID, the names that several services use
    and the clock of the hooks.
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT

components:
  securitySchemes:
    AccessToken:
      type: openIdConnect
      description: >-
        An access token of the identity provider, sent as a bearer token in
        the Authorization header. The scopes of the token say what the caller
        may do, and an operation names the scopes that it needs. See ADR 0013.
      openIdConnectUrl: http://localhost:8083/.well-known/openid-configuration

  pathItems:
    Clock:
      get:
        operationId: getClock
        summary: Read the clock.
        description: >-
          Reads the clock of the rules: the instant that the service takes as
          now, and whether a test has set it. See ADR 0014.
        tags:
          - Clock
        security:
          - AccessToken:
              - hooks:use
        responses:
          "200":
            description: The clock.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Clock"
                examples:
                  standing:
                    $ref: "#/components/examples/StandingClock"
                  running:
                    $ref: "#/components/examples/RunningClock"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/InsufficientScope"
          default:
            $ref: "#/components/responses/Problem"
      put:
        operationId: setClock
        summary: Set the clock.
        description: >-
          Sets the clock of the rules to an instant. The clock stands still
          there until a test sets it again or resets it. A repeat changes
          nothing.
        tags:
          - Clock
        security:
          - AccessToken:
              - hooks:use
        requestBody:
          description: The instant that the clock shows from now on.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockSetting"
              examples:
                lastInstantOfADay:
                  summary: The last millisecond before a night starts
                  value:
                    now: "2026-11-25T22:59:59.999Z"
        responses:
          "200":
            description: The clock stands at the instant.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Clock"
                examples:
                  standing:
                    $ref: "#/components/examples/StandingClock"
          "400":
            $ref: "#/components/responses/InvalidRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/InsufficientScope"
          default:
            $ref: "#/components/responses/Problem"
      delete:
        operationId: resetClock
        summary: Reset the clock.
        description: >-
          Lets the clock of the rules run with real time again. A repeat
          changes nothing.
        tags:
          - Clock
        security:
          - AccessToken:
              - hooks:use
        responses:
          "204":
            description: The clock runs with real time.
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/InsufficientScope"
          default:
            $ref: "#/components/responses/Problem"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Makes the request safe to repeat. The client chooses the key. A repeat
        of the same request with the same key gets the first response again.
        See ADR 0012.
      schema:
        type: string
        description: >-
          The key in double quotes: 1 to 64 letters, digits, hyphens or
          underscores.
        pattern: '^"[A-Za-z0-9_-]{1,64}"$'
        examples:
          - '"8e03978e-40d5-43e8-bc93-6894a57f9324"'
    PageLimit:
      name: limit
      in: query
      required: false
      description: The most items that one page holds.
      schema:
        type: integer
        description: A count of items, from 1 to 100. Without it, a page holds 20.
        minimum: 1
        maximum: 100
        default: 20
        examples:
          - 20
    PageCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Where the page starts: the nextCursor of the page before. Without it,
        the list starts at its beginning.
      schema:
        type: string
        description: A value that only the service can read.
        minLength: 1
        examples:
          - eyJhZnRlciI6IjliMmY3YzFlIn0

  headers:
    WwwAuthenticate:
      description: >-
        The challenge of RFC 6750. It is the scheme Bearer alone when the
        request had no token. When the request had one that is not valid, it
        also names the error invalid_token.
      required: true
      schema:
        type: string
        description: The scheme Bearer, and the error when the request had a token.
        examples:
          - Bearer error="invalid_token"

  responses:
    Unauthenticated:
      description: >-
        The request has no valid access token. It has none at all, or one that
        is expired, wrongly signed or meant for another service.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthenticated:
              $ref: "#/components/examples/Unauthenticated"
    InsufficientScope:
      description: The access token is valid, and it lacks a scope that the operation needs.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            insufficientScope:
              $ref: "#/components/examples/InsufficientScope"
    Problem:
      description: >-
        A problem. Its type and its status say what happened. See ADR 0010.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unexpectedFailure:
              $ref: "#/components/examples/UnexpectedFailure"
    InvalidRequest:
      description: The request breaks the contract. The problem lists every violation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidRequest:
              $ref: "#/components/examples/InvalidRequest"
    NotFound:
      description: >-
        The thing that the URL names does not exist. For a user, a thing of
        another customer does not exist either.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              $ref: "#/components/examples/NotFound"

  examples:
    Unauthenticated:
      summary: A request without a valid access token
      value:
        type: about:blank
        title: Unauthorized
        status: 401
    InsufficientScope:
      summary: A token without a scope that the operation needs
      value:
        type: https://xfeuer.github.io/maker-checker/problems/insufficient-scope
        title: The access token lacks a scope that the operation needs.
        status: 403
    NotFound:
      summary: A URL that names nothing
      value:
        type: about:blank
        title: Not Found
        status: 404
    UnexpectedFailure:
      summary: A failure that nobody expected
      value:
        type: about:blank
        title: Internal Server Error
        status: 500
    InvalidRequest:
      summary: A request with two violations
      value:
        type: https://xfeuer.github.io/maker-checker/problems/invalid-request
        title: The request breaks the contract.
        status: 400
        errors:
          - detail: The amount has exactly two decimals.
            pointer: "#/amount/amount"
          - detail: The key is 1 to 64 letters, digits, hyphens or underscores, in double quotes.
            parameter: Idempotency-Key
    IdempotencyKeyReused:
      summary: A key that came before, with another request
      value:
        type: https://xfeuer.github.io/maker-checker/problems/idempotency-key-reused
        title: The idempotency key belongs to another request.
        status: 422
    RequestInProgress:
      summary: A repeat that arrives while the first request is still being handled
      value:
        type: https://xfeuer.github.io/maker-checker/problems/request-in-progress
        title: The first request with this idempotency key is still being handled.
        status: 409
    UnknownAlias:
      summary: An alias that the clearing network does not know
      value:
        type: https://xfeuer.github.io/maker-checker/problems/unknown-alias
        title: The clearing network does not know the alias.
        status: 422
    PaymentExists:
      summary: A second payment under one end-to-end ID
      value:
        type: https://xfeuer.github.io/maker-checker/problems/payment-exists
        title: A payment with this end-to-end ID exists, with another content.
        status: 409
    StandingClock:
      summary: A clock that a test has set
      value:
        now: "2026-11-25T22:59:59.999Z"
        standing: true
    RunningClock:
      summary: A clock that runs with real time
      value:
        now: "2026-11-25T18:30:00.482Z"
        standing: false

  schemas:
    ServiceStatus:
      type: object
      description: Identity of a running service.
      additionalProperties: false
      required:
        - service
        - version
      properties:
        service:
          type: string
          description: Name of the service.
          examples:
            - account-service
        version:
          type: string
          description: Version of the running build.
          examples:
            - 0.1.0
    AccountId:
      type: string
      format: uuid
      description: The identifier of an account.
      examples:
        - 9b2f7c1e-3a54-4d0b-8f6e-5c1a2b3d4e5f
    AccountNumber:
      type: string
      description: What a payer needs to pay an account of the platform. account-service issues its eight digits.
      pattern: '^[0-9]{8}$'
      examples:
        - "48213907"
    CorrelationId:
      type: string
      description: >-
        The correlation ID of a request: the trace ID of its traceparent
        header, in 32 hexadecimal digits. See ADR 0014.
      pattern: '^[0-9a-f]{32}$'
      examples:
        - 0af7651916cd43dd8448eb211c80319c
    EndToEndId:
      type: string
      description: >-
        The identifier that a payment keeps at every participant (PAY-6).
        Whoever starts the payment issues it: the platform for an internal and
        an outbound payment, the participant of the payer for an inbound one.
        It has the form that Pix gives it: the letter E, 20 digits and 11
        letters or digits.
      pattern: '^E[0-9]{20}[0-9A-Za-z]{11}$'
      examples:
        - E12345678202611251830a1B2c3D4e5F
    Participant:
      type: string
      description: An institution on the clearing network, named by its number of eight digits.
      pattern: '^[0-9]{8}$'
      examples:
        - "87654321"
    Alias:
      type: string
      description: >-
        A name that the clearing network resolves to an account at a
        participant, such as an e-mail address or a phone number. It has 1 to
        77 letters, digits and signs out of @ . _ + and -, so that it fits
        into a URL as it is. It is personal data.
      pattern: '^[A-Za-z0-9@._+-]{1,77}$'
      x-sensitive: true
      examples:
        - pagamentos@aurora.example
    PartyName:
      type: string
      description: >-
        The name of a payer or a payee outside the platform, as the clearing
        network gives it. It is personal data.
      minLength: 1
      maxLength: 140
      x-sensitive: true
      examples:
        - Padaria Aurora Ltda
    NetworkReason:
      type: string
      description: >-
        Why the clearing network refused a payment, as a code of the network.
        The platform keeps the code and does not read it.
      pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
      maxLength: 64
      examples:
        - ACCOUNT_CLOSED
    Problem:
      type: object
      description: >-
        A problem document of RFC 9457. A client relies on its type and its
        status. The title and the detail are for people.
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: >-
            Identifies the problem. It is about:blank when the status says
            everything.
          examples:
            - https://xfeuer.github.io/maker-checker/problems/invalid-request
        title:
          type: string
          description: Names the problem in a few words. It is the same for every problem of one type.
          examples:
            - The request breaks the contract.
        status:
          type: integer
          description: The status code of the response.
          minimum: 400
          maximum: 599
          examples:
            - 400
        detail:
          type: string
          description: Explains this one occurrence to a person.
          examples:
            - The request has two violations.
        errors:
          type: array
          description: Every violation of the contract. Only a problem with the status 400 has it.
          minItems: 1
          items:
            $ref: "#/components/schemas/Violation"
          examples:
            - - detail: The amount has exactly two decimals.
                pointer: "#/amount/amount"
    Violation:
      type: object
      description: >-
        One violation of the contract. It names its place with a pointer or
        with a parameter.
      additionalProperties: false
      required:
        - detail
      properties:
        detail:
          type: string
          description: Says what is wrong.
          examples:
            - The amount has exactly two decimals.
        pointer:
          type: string
          description: A JSON Pointer to the place in the body, written as a URI fragment.
          examples:
            - "#/amount/amount"
        parameter:
          type: string
          description: The name of the header, the query parameter or the path parameter.
          examples:
            - Idempotency-Key
    Money:
      type: object
      description: An amount of money with its currency. See ADR 0011.
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: >-
            The amount in reais: a point and exactly two decimals, no sign and
            no leading zero.
          pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
          examples:
            - "10.50"
        currency:
          type: string
          description: The currency, as a code of ISO 4217. The platform has one.
          enum:
            - BRL
          examples:
            - BRL
    Balance:
      type: object
      description: >-
        A balance with its currency. It has the form of money, with a minus
        sign in front when it is below zero. See ADR 0011.
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: >-
            The balance in reais: a minus sign when it is below zero, a point
            and exactly two decimals, and no leading zero. Zero has no sign.
          pattern: '^(-(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,9}\.[0-9]{2})|(0|[1-9][0-9]{0,9})\.[0-9]{2})$'
          examples:
            - "-250.00"
        currency:
          type: string
          description: The currency of the balance, as a code of ISO 4217.
          enum:
            - BRL
          examples:
            - BRL
    NextCursor:
      type: string
      description: The cursor of the next page of a list. The last page has none.
      minLength: 1
      examples:
        - eyJhZnRlciI6IjliMmY3YzFlIn0
    Clock:
      type: object
      description: The clock of the rules of a service. See ADR 0014.
      additionalProperties: false
      required:
        - now
        - standing
      properties:
        now:
          type: string
          format: date-time
          description: The instant that the service takes as now, in UTC.
          examples:
            - "2026-11-25T22:59:59.999Z"
        standing:
          type: boolean
          description: >-
            True when a test has set the clock: it stands still. False when it
            runs with real time.
          examples:
            - true
    ClockSetting:
      type: object
      description: What a test sends to set the clock.
      additionalProperties: false
      required:
        - now
      properties:
        now:
          type: string
          format: date-time
          description: The instant to set the clock to, in UTC.
          examples:
            - "2026-11-25T22:59:59.999Z"
