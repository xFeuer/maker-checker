openapi: 3.1.2

info:
  title: Breaks bodies-have-an-example
  version: 0.1.0

paths:
  /v1/things:
    get:
      operationId: listThings
      responses:
        "200":
          description: The things. The body has a schema and no example.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thing"
        default:
          description: A problem.

components:
  schemas:
    Thing:
      type: string
      description: A thing.
      examples:
        - thing
