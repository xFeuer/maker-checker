openapi: 3.1.2

info:
  title: Breaks error-responses-are-problems
  version: 0.1.0

paths:
  /v1/things:
    get:
      operationId: listThings
      responses:
        "200":
          description: The things.
        "404":
          description: An error that is not a problem document.
          content:
            application/json:
              schema:
                type: string
        default:
          description: A problem.
