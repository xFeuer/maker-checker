openapi: 3.1.2

info:
  title: Breaks scopes-are-known
  version: 0.1.0

paths:
  /v1/things:
    get:
      operationId: listThings
      security:
        - AccessToken:
            - things:read
      responses:
        "200":
          description: The things. The scope above is not in the list of the ruleset.
        "401":
          description: A problem.
        "403":
          description: A problem.
        default:
          description: A problem.

components:
  securitySchemes:
    AccessToken:
      $ref: "../common/components.yaml#/components/securitySchemes/AccessToken"
