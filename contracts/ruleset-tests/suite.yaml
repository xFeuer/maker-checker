# The tests of ../ruleset.yaml. vacuum test runs them, and a case passes when vacuum reports exactly what the case
# expects. See README.md.
version: 1
ruleset: ../ruleset.yaml
# The functions of our own that three of the rules use.
functions: ../functions
cases:
  # One specification keeps every rule. It is linted with all of them, the rules of vacuum included.
  - id: keeps-the-rules
    input: keeps-the-rules.yaml
    expect:
      diagnostics: []
  # So does one specification of hooks.
  - id: keeps-the-rules-of-hooks
    input: keeps-the-rules-of-hooks.yaml
    expect:
      diagnostics: []
  # Each rule of ours has a document that breaks it and nothing else.
  - id: breaks-error-responses-are-problems
    input: breaks-error-responses-are-problems.yaml
    rules: [error-responses-are-problems]
    expect:
      diagnostics:
        - rule: error-responses-are-problems
  - id: breaks-operations-have-a-default-response
    input: breaks-operations-have-a-default-response.yaml
    rules: [operations-have-a-default-response]
    expect:
      diagnostics:
        - rule: operations-have-a-default-response
  - id: breaks-problem-types-are-well-formed
    input: breaks-problem-types-are-well-formed.yaml
    rules: [problem-types-are-well-formed]
    expect:
      diagnostics:
        - rule: problem-types-are-well-formed
  - id: breaks-problem-statuses-match-their-response
