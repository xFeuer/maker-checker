    input: breaks-only-hooks-take-the-hooks-scope.yaml
    rules: [only-hooks-take-the-hooks-scope]
    expect:
      diagnostics:
        - rule: only-hooks-take-the-hooks-scope
  # So does the rule of vacuum that the ruleset switches on.
  - id: breaks-tag-description
    input: breaks-tag-description.yaml
    rules: [tag-description]
    expect:
      diagnostics:
        - rule: tag-description
  # The rule of vacuum that the ruleset writes out again has a document with one bad example for each format on
  # the list of formats-are-known. vacuum has to report each of them, at its place.
  - id: breaks-oas3-valid-schema-example
    input: breaks-oas3-valid-schema-example.yaml
    rules: [oas3-valid-schema-example]
    expect:
      diagnostics:
        - rule: oas3-valid-schema-example
          path: "$.components.schemas['ThingId'].examples[0]"
        - rule: oas3-valid-schema-example
          path: "$.components.schemas['CreatedAt'].examples[0]"
        - rule: oas3-valid-schema-example
          path: "$.components.schemas['ProblemType'].examples[0]"
        - rule: oas3-valid-schema-example
          path: "$.components.schemas['ThingLocation'].examples[0]"
