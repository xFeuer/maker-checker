openapi: 3.1.2

info:
  title: payment-service
  summary: Payments of the maker-checker platform.
  description: >-
    The service that owns the payments of the platform. It keeps their states,
    the approvals, the limits, the fees and the audit trail, and it talks to
    the clearing network. It moves money only by asking account-service. A
    maker creates a payment here, and a checker decides it. The clearing
    network delivers its inbound payments here and gives its final answers.
    See ADR 0008.
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8081
    description: The local stack, as `deploy/compose.yaml` starts it.

tags:
  - name: Status
    description: Whether the service is up and which build it runs.
  - name: Payments
    description: The payments, from their creation to their final state.
  - name: Approval
    description: The one decision on a payment that waits for approval.
  - name: Audit trail
    description: The record of what happened to a payment.
  - name: Limits
    description: The limits of an account, and what it has paid out.
  - name: Clearing network
    description: What the clearing network calls. No user has the scopes for it.

paths:
  /v1/status:
    get:
      operationId: getStatus
      summary: Report the service name and version.
      description: >-
        The smoke-test target. A successful response proves that the service
        is up and speaks this contract. Anybody may call it, without a token.
      tags:
        - Status
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/ServiceStatus"
              examples:
                up:
                  summary: A running service
                  value:
                    service: payment-service
                    version: 0.1.0
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"
  /v1/payments:
    post:
      operationId: createPayment
      summary: Create a payment.
      description: >-
        Creates an internal or an outbound payment from an account of the
        customer of the caller (PAY-2, PAY-3). For an outbound payment, the
        service first resolves the alias at the clearing network (NET-2), and
        it fixes the fee (FEE-3). The response shows the payment as it is at
        that moment. Above the approval limit, it waits for approval (APR-1).
        Otherwise it is processing, or it has already ended, and a client
        reads the payment until its state is final. A payment that a daily
        limit, a night limit, the funds or the clearing network stops is
        created too, and it reads as failed (PAY-9, PAY-11). A repeat with
        the same key and the same body gets the first response again,
        whatever has happened since (PAY-5).
      tags:
        - Payments
      security:
        - AccessToken:
            - payments:create
      parameters:
        - $ref: "../common/components.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        description: The payment to create. Its kind says how it names the payee.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPayment"
            examples:
              internal:
                summary: An internal payment, to an account number
                value:
                  kind: INTERNAL
                  payerAccountId: 9b2f7c1e-3a54-4d0b-8f6e-5c1a2b3d4e5f
                  payeeAccountNumber: "75306214"
                  amount:
                    amount: "350.00"
                    currency: BRL
              outbound:
                summary: An outbound payment, to an alias
                value:
                  kind: OUTBOUND
                  payerAccountId: 9b2f7c1e-3a54-4d0b-8f6e-5c1a2b3d4e5f
                  payeeAlias: pagamentos@aurora.example
                  amount:
                    amount: "200.00"
                    currency: BRL
      responses:
        "201":
          description: The payment exists. The body shows it as it is at that moment.
          headers:
            Location:
              $ref: "#/components/headers/PaymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              examples:
                pendingApproval:
                  $ref: "#/components/examples/PendingPayment"
                processing:
                  $ref: "#/components/examples/ProcessingPayment"
                settled:
                  $ref: "#/components/examples/InternalPayment"
                failed:
                  $ref: "#/components/examples/PaymentOverTheDailyLimit"
        "400":
          $ref: "../common/components.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "../common/components.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../common/components.yaml#/components/responses/InsufficientScope"
        "409":
          description: The first request with this key is still being handled.
          content:
            application/problem+json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/Problem"
              examples:
                requestInProgress:
                  $ref: "../common/components.yaml#/components/examples/RequestInProgress"
        "422":
          description: >-
            The request breaks a rule of the domain, or its key came before
            with another request. No payment is created.
          content:
            application/problem+json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/Problem"
              examples:
                idempotencyKeyReused:
                  $ref: "../common/components.yaml#/components/examples/IdempotencyKeyReused"
                amountNotPositive:
                  $ref: "#/components/examples/AmountNotPositive"
                paymentLimitExceeded:
                  $ref: "#/components/examples/PaymentLimitExceeded"
                unknownPayerAccount:
                  $ref: "#/components/examples/UnknownPayerAccount"
                unknownPayeeAccount:
                  $ref: "#/components/examples/UnknownPayeeAccount"
                payeeIsPayer:
                  $ref: "#/components/examples/PayeeIsPayer"
                unknownAlias:
                  $ref: "../common/components.yaml#/components/examples/UnknownAlias"
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"
    get:
      operationId: listPayments
      summary: List the payments.
      description: >-
        Lists the payments of the customer of the caller in pages, in the
        order in which they were created: the payments that one of its
        accounts pays, and the ones that pay one of its accounts. A payment
        of the second sort is on the list only once it is settled (PAY-15). A
        payment has to pass every filter of the request.
      tags:
        - Payments
      security:
        - AccessToken:
            - payments:read
      parameters:
        - $ref: "#/components/parameters/PaymentStateFilter"
        - $ref: "#/components/parameters/PaymentAccountFilter"
        - $ref: "#/components/parameters/EndToEndIdFilter"
        - $ref: "../common/components.yaml#/components/parameters/PageLimit"
        - $ref: "../common/components.yaml#/components/parameters/PageCursor"
      responses:
        "200":
          description: One page of payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPage"
              examples:
                lastPage:
                  $ref: "#/components/examples/PaymentPage"
        "400":
          $ref: "../common/components.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "../common/components.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../common/components.yaml#/components/responses/InsufficientScope"
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Read a payment.
      description: >-
        Reads one payment as it is now. A client that waits for a final state
        reads the payment until it has one. To the customer of the payee, an
        internal payment does not exist before it is settled (PAY-15). To
        every other customer, it never exists (CUS-4).
      tags:
        - Payments
      security:
        - AccessToken:
            - payments:read
      parameters:
        - $ref: "#/components/parameters/PaymentIdInPath"
      responses:
        "200":
          description: The payment, as the customer of the caller sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              examples:
                settledOutbound:
                  $ref: "#/components/examples/SettledOutboundPayment"
                refusedByTheNetwork:
                  $ref: "#/components/examples/PaymentRefusedByTheNetwork"
                internalForThePayee:
                  $ref: "#/components/examples/InternalPaymentOfThePayee"
                inbound:
                  $ref: "#/components/examples/InboundPayment"
        "401":
          $ref: "../common/components.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../common/components.yaml#/components/responses/InsufficientScope"
        "404":
          $ref: "../common/components.yaml#/components/responses/NotFound"
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"
  /v1/payments/{paymentId}/decision:
    put:
      operationId: decidePayment
      summary: Approve or reject a payment.
      description: >-
        Decides a payment that waits for approval. An approved payment starts
        processing, and a rejected one has ended. Only a checker of the
        customer of the payer decides (APR-2), and to every other customer
        this URL names nothing. The maker of a payment never decides it, also
        as a checker (APR-3). A payment is decided once (APR-6): the same
        decision from the same checker again changes nothing, and any other
        decision on a payment that no longer waits is refused.
      tags:
        - Approval
      security:
        - AccessToken:
            - payments:decide
      parameters:
        - $ref: "#/components/parameters/PaymentIdInPath"
      requestBody:
        description: What the checker decides.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDecision"
            examples:
              approve:
                summary: An approval
                value:
                  decision: APPROVED
              reject:
                summary: A rejection
                value:
                  decision: REJECTED
      responses:
        "200":
          description: The payment as it is now, decided by this request or by an earlier one like it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              examples:
                approved:
                  $ref: "#/components/examples/ApprovedPayment"
                rejected:
                  $ref: "#/components/examples/RejectedPayment"
        "400":
          $ref: "../common/components.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "../common/components.yaml#/components/responses/Unauthenticated"
        "403":
          description: >-
            The caller may not decide this payment. The token lacks the scope,
            or the caller made the payment.
          content:
            application/problem+json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/Problem"
              examples:
                insufficientScope:
                  $ref: "../common/components.yaml#/components/examples/InsufficientScope"
                decisionByTheMaker:
                  $ref: "#/components/examples/DecisionByTheMaker"
        "404":
          $ref: "../common/components.yaml#/components/responses/NotFound"
        "409":
          description: >-
            The payment does not wait for approval: somebody else decided it,
            it expired, or it never needed a decision.
          content:
            application/problem+json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/Problem"
              examples:
                paymentNotPendingApproval:
                  $ref: "#/components/examples/PaymentNotPendingApproval"
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"
  /v1/payments/{paymentId}/cancellation:
    put:
      operationId: cancelPayment
      summary: Cancel a payment.
      description: >-
        Withdraws a payment that waits for approval. Only its maker can
        (APR-4), and to a customer other than the one of the payer this URL
        names nothing. A cancellation is a decision, so it takes effect once
        (APR-6): a repeat by the maker changes nothing, and a payment that a
        checker has decided or that has expired is not canceled anymore.
      tags:
        - Approval
      security:
        - AccessToken:
            - payments:cancel
      parameters:
        - $ref: "#/components/parameters/PaymentIdInPath"
      responses:
        "200":
          description: The payment as it is now, canceled by this request or by an earlier one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              examples:
                canceled:
                  $ref: "#/components/examples/CanceledPayment"
        "401":
          $ref: "../common/components.yaml#/components/responses/Unauthenticated"
        "403":
          description: >-
            The caller may not cancel this payment. The token lacks the scope,
            or another user made the payment.
          content:
            application/problem+json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/Problem"
              examples:
                insufficientScope:
                  $ref: "../common/components.yaml#/components/examples/InsufficientScope"
                cancellationByAnotherUser:
                  $ref: "#/components/examples/CancellationByAnotherUser"
        "404":
          $ref: "../common/components.yaml#/components/responses/NotFound"
        "409":
          description: >-
            The payment does not wait for approval: a checker decided it, it
            expired, or it never waited.
          content:
            application/problem+json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/Problem"
              examples:
                paymentNotPendingApproval:
                  $ref: "#/components/examples/PaymentNotPendingApproval"
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"
  /v1/payments/{paymentId}/events:
    get:
      operationId: listPaymentEvents
      summary: List the audit events of a payment.
      description: >-
        Lists the audit trail of one payment in pages, in the order of the
        sequence numbers (AUD-4). A customer reads the trail of a payment that
        it sees from its creation: one that its account pays, or an inbound
        one. The trail of an internal payment names the users of the payer, so
        to the customer of the payee this URL names nothing (PAY-15).
      tags:
        - Audit trail
      security:
        - AccessToken:
            - payments:read
      parameters:
        - $ref: "#/components/parameters/PaymentIdInPath"
        - $ref: "../common/components.yaml#/components/parameters/PageLimit"
        - $ref: "../common/components.yaml#/components/parameters/PageCursor"
      responses:
        "200":
          description: One page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentEventPage"
              examples:
                rejected:
                  $ref: "#/components/examples/TrailOfARejectedPayment"
                internal:
                  $ref: "#/components/examples/TrailOfAnInternalPayment"
                inbound:
                  $ref: "#/components/examples/TrailOfAnInboundPayment"
        "400":
          $ref: "../common/components.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "../common/components.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../common/components.yaml#/components/responses/InsufficientScope"
        "404":
          $ref: "../common/components.yaml#/components/responses/NotFound"
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"
  /v1/accounts/{accountId}/limits:
    get:
      operationId: getLimits
      summary: Read the limits of an account.
      description: >-
        Reads the three limits of an account of the customer of the caller
        (LIM-1), with what the account has paid out in the current day and in
        the current night. The clock of the rules says which day and which
        night that is (TIM-1).
      tags:
        - Limits
      security:
        - AccessToken:
            - accounts:read
      parameters:
        - $ref: "#/components/parameters/AccountIdInPath"
      responses:
        "200":
          description: The limits and the totals of the account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLimits"
              examples:
                duringTheDay:
                  $ref: "#/components/examples/LimitsDuringTheDay"
                duringANight:
                  $ref: "#/components/examples/LimitsDuringANight"
        "401":
          $ref: "../common/components.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../common/components.yaml#/components/responses/InsufficientScope"
        "404":
          $ref: "../common/components.yaml#/components/responses/NotFound"
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"
  /v1/inbound-payments/{endToEndId}:
    put:
      operationId: deliverInboundPayment
      summary: Deliver an inbound payment.
      description: >-
        Takes a payment that arrives from the clearing network for an account
        of the platform (PAY-2). The platform books it at once, so the payment
        is settled from its first moment (PAY-12). The network names the
        payment by its end-to-end ID, so a second delivery with the same
        content books nothing and gets the same answer (PAY-13). A delivery
        for an account number that the platform does not know is refused, and
        nothing is booked.
      tags:
        - Clearing network
      security:
        - AccessToken:
            - payments:deliver
      parameters:
        - $ref: "#/components/parameters/EndToEndIdInPath"
      requestBody:
        description: The amount, the payee and the payer of the inbound payment.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundDelivery"
            examples:
              delivery:
                summary: A payment of 75 reais from another participant
                value:
                  amount:
                    amount: "75.00"
                    currency: BRL
                  payeeAccountNumber: "48213907"
                  payerName: Mercado Sol Ltda
                  payerParticipant: "87654321"
      responses:
        "204":
          description: The payment is settled, by this delivery or by an earlier one.
        "400":
          $ref: "../common/components.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "../common/components.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../common/components.yaml#/components/responses/InsufficientScope"
        "409":
          description: Another payment has this end-to-end ID, or the first delivery had another content.
          content:
            application/problem+json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/Problem"
              examples:
                paymentExists:
                  $ref: "../common/components.yaml#/components/examples/PaymentExists"
        "422":
          description: The delivery breaks a rule of the domain, and nothing is booked.
          content:
            application/problem+json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/Problem"
              examples:
                unknownPayeeAccount:
                  $ref: "#/components/examples/UnknownPayeeAccount"
                amountNotPositive:
                  $ref: "#/components/examples/AmountNotPositive"
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"
  /v1/outbound-payments/{endToEndId}/answer:
    put:
      operationId: answerOutboundPayment
      summary: Give the final answer for an outbound payment.
      description: >-
        Takes the one final answer of the clearing network for an outbound
        payment that is processing: settled, or refused with a reason (NET-3).
        After a settled answer, the platform books the payment, and it reads
        as settled once that is done (PAY-14). After a refused one, the hold
        is released and the payment is failed (PAY-11). An answer that the
        platform has already applied changes nothing when it comes again
        (NET-5).
      tags:
        - Clearing network
      security:
        - AccessToken:
            - payments:answer
      parameters:
        - $ref: "#/components/parameters/EndToEndIdInPath"
      requestBody:
        description: The outcome, and the reason of a refusal.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkAnswer"
            examples:
              settled:
                summary: The network has settled the payment
                value:
                  outcome: SETTLED
              refused:
                summary: The network has refused the payment
                value:
                  outcome: REFUSED
                  reason: ACCOUNT_CLOSED
      responses:
        "204":
          description: The platform has the answer, from this request or from an earlier one.
        "400":
          $ref: "../common/components.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "../common/components.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../common/components.yaml#/components/responses/InsufficientScope"
        "404":
          $ref: "../common/components.yaml#/components/responses/NotFound"
        "409":
          description: >-
            The payment is not processing: it has another final answer, or
            it never went to the network.
          content:
            application/problem+json:
              schema:
                $ref: "../common/components.yaml#/components/schemas/Problem"
              examples:
                paymentNotProcessing:
                  $ref: "#/components/examples/PaymentNotProcessing"
        default:
          $ref: "../common/components.yaml#/components/responses/Problem"

components:
  securitySchemes:
    AccessToken:
      $ref: "../common/components.yaml#/components/securitySchemes/AccessToken"

  parameters:
    PaymentIdInPath:
      name: paymentId
      in: path
      required: true
      description: The payment that the URL names.
      schema:
        $ref: "#/components/schemas/PaymentId"
    AccountIdInPath:
      name: accountId
      in: path
      required: true
      description: The account that the URL names.
      schema:
        $ref: "../common/components.yaml#/components/schemas/AccountId"
    EndToEndIdInPath:
      name: endToEndId
      in: path
      required: true
      description: The end-to-end ID of the payment that the URL names.
      schema:
        $ref: "../common/components.yaml#/components/schemas/EndToEndId"
    PaymentStateFilter:
      name: state
      in: query
      required: false
      description: Narrows the list to the payments in one state.
      schema:
        $ref: "#/components/schemas/PaymentState"
    PaymentAccountFilter:
      name: accountId
      in: query
      required: false
      description: Narrows the list to the payments that one account pays or is paid by.
      schema:
        $ref: "../common/components.yaml#/components/schemas/AccountId"
    EndToEndIdFilter:
      name: endToEndId
      in: query
      required: false
      description: >-
        Narrows the list to the payment with this end-to-end ID. It is how a
        client finds an inbound payment, whose identifier it does not know.
      schema:
        $ref: "../common/components.yaml#/components/schemas/EndToEndId"

  headers:
    PaymentLocation:
      description: Where the new payment is. A client reads it there until its state is final.
      required: true
      schema:
        type: string
        format: uri-reference
        description: The path of the payment.
        examples:
          - /v1/payments/c7a1e2d4-5b6f-4a80-9c3e-1d2f3a4b5c6d

  examples:
    PendingPayment:
      summary: An outbound payment that waits for approval
      description: Its amount is above the approval limit of the customer. The fee is at its cap (FEE-2).
      value:
        paymentId: f1e2d3c4-b5a6-4978-8a9b-0c1d2e3f4a5b
        endToEndId: E12345678202611251900k7L8m9N0p1Q
        kind: OUTBOUND
        state: PENDING_APPROVAL
        side: PAYER
        amount:
          amount: "2500.00"
          currency: BRL
        fee:
          amount: "10.00"
          currency: BRL
        payerAccountId: 9b2f7c1e-3a54-4d0b-8f6e-5c1a2b3d4e5f
        payerAccountNumber: "48213907"
        payeeAlias: pagamentos@aurora.example
        payeeName: Padaria Aurora Ltda
        payeeParticipant: "87654321"
        madeBy: 4b7e2a90-1c3d-4f5a-8b6c-7d8e9f0a1b2c
        createdAt: "2026-11-25T19:00:00Z"
    ApprovedPayment:
      summary: A payment that a checker has approved
      description: It is processing now, and it waits for the answer of the clearing network.
      value:
        paymentId: f1e2d3c4-b5a6-4978-8a9b-0c1d2e3f4a5b
        endToEndId: E12345678202611251900k7L8m9N0p1Q
        kind: OUTBOUND
        state: PROCESSING
        side: PAYER
        amount:
          amount: "2500.00"
          currency: BRL
        fee:
          amount: "10.00"
          currency: BRL
        payerAccountId: 9b2f7c1e-3a54-4d0b-8f6e-5c1a2b3d4e5f
        payerAccountNumber: "48213907"
        payeeAlias: pagamentos@aurora.example
        payeeName: Padaria Aurora Ltda
        payeeParticipant: "87654321"
        madeBy: 4b7e2a90-1c3d-4f5a-8b6c-7d8e9f0a1b2c
        createdAt: "2026-11-25T19:00:00Z"
    RejectedPayment:
      summary: A payment that a checker has rejected
      description: It has ended, and no money has moved.
      value:
        paymentId: f1e2d3c4-b5a6-4978-8a9b-0c1d2e3f4a5b
        endToEndId: E12345678202611251900k7L8m9N0p1Q
        kind: OUTBOUND
        state: REJECTED
        side: PAYER
        amount:
          amount: "2500.00"
          currency: BRL
        fee:
          amount: "10.00"
          currency: BRL
        payerAccountId: 9b2f7c1e-3a54-4d0b-8f6e-5c1a2b3d4e5f
        payerAccountNumber: "48213907"
        payeeAlias: pagamentos@aurora.example
        payeeName: Padaria Aurora Ltda
        payeeParticipant: "87654321"
        madeBy: 4b7e2a90-1c3d-4f5a-8b6c-7d8e9f0a1b2c
        createdAt: "2026-11-25T19:00:00Z"
    CanceledPayment:
      summary: A payment that its maker has canceled
      description: The maker withdrew it before a checker decided.
      value:
