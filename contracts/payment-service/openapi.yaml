  schemas:
    PaymentId:
      type: string
      format: uuid
      description: >-
        The identifier of a payment. The platform issues it. The hold and the
        ledger transaction of the payment in account-service carry it too.
      examples:
        - c7a1e2d4-5b6f-4a80-9c3e-1d2f3a4b5c6d
    UserId:
      type: string
      description: >-
        A user, as the sub of their access token names them (ADR 0013). The
        identity provider chooses its form.
      minLength: 1
      maxLength: 255
      examples:
        - 4b7e2a90-1c3d-4f5a-8b6c-7d8e9f0a1b2c
    PaymentKind:
      type: string
      description: >-
        The kind of a payment (PAY-2). INTERNAL pays an account of the
        platform. OUTBOUND pays an alias, through the clearing network.
        INBOUND arrives from the clearing network, and nobody creates it.
      enum:
        - INTERNAL
        - OUTBOUND
        - INBOUND
      examples:
        - OUTBOUND
    PaymentState:
      type: string
      description: >-
        Where a payment stands (PAY-7). PENDING_APPROVAL and PROCESSING are
        not final. SETTLED, FAILED, REJECTED, CANCELED and EXPIRED are final,
        and a payment never leaves them. Only a SETTLED payment has moved
        money.
      enum:
        - PENDING_APPROVAL
        - PROCESSING
        - SETTLED
        - FAILED
        - REJECTED
        - CANCELED
        - EXPIRED
      examples:
        - PROCESSING
    PaymentSide:
      type: string
      description: >-
        The side from which the customer of the caller sees a payment. PAYER
        when it owns the payer account, also when it owns both accounts.
        PAYEE when it owns only the account that is paid.
      enum:
        - PAYER
        - PAYEE
      examples:
        - PAYER
    FailureReason:
      type: string
      description: >-
        Why a payment failed. DAILY_LIMIT and NIGHT_LIMIT: it would have taken
        the total of its day or of its night above the limit (LIM-7).
        INSUFFICIENT_FUNDS: the available balance did not cover its hold
        (LED-5). REFUSED_BY_NETWORK: the clearing network refused it (PAY-11).
      enum:
        - DAILY_LIMIT
        - NIGHT_LIMIT
        - INSUFFICIENT_FUNDS
        - REFUSED_BY_NETWORK
      examples:
        - DAILY_LIMIT
    NewPayment:
      description: >-
        What a maker sends to create a payment. Its kind says which of the two
        forms it has.
      oneOf:
        - $ref: "#/components/schemas/NewInternalPayment"
        - $ref: "#/components/schemas/NewOutboundPayment"
      discriminator:
        propertyName: kind
        mapping:
          INTERNAL: "#/components/schemas/NewInternalPayment"
          OUTBOUND: "#/components/schemas/NewOutboundPayment"
    NewInternalPayment:
      type: object
      description: An internal payment to create. It names the payee by its account number.
      additionalProperties: false
      required:
        - kind
        - payerAccountId
        - payeeAccountNumber
        - amount
      properties:
        kind:
          type: string
          description: Says that the new payment is internal.
          enum:
            - INTERNAL
          examples:
            - INTERNAL
        payerAccountId:
          $ref: "../common/components.yaml#/components/schemas/AccountId"
        payeeAccountNumber:
          $ref: "../common/components.yaml#/components/schemas/AccountNumber"
        amount:
          $ref: "../common/components.yaml#/components/schemas/Money"
    NewOutboundPayment:
      type: object
      description: An outbound payment to create. It names the payee by an alias.
      additionalProperties: false
      required:
        - kind
        - payerAccountId
        - payeeAlias
        - amount
      properties:
        kind:
          type: string
          description: Says that the new payment is outbound.
          enum:
            - OUTBOUND
          examples:
            - OUTBOUND
        payerAccountId:
          $ref: "../common/components.yaml#/components/schemas/AccountId"
        payeeAlias:
          $ref: "../common/components.yaml#/components/schemas/Alias"
        amount:
          $ref: "../common/components.yaml#/components/schemas/Money"
    Payment:
      type: object
      description: >-
        A payment, as the customer of the caller sees it. The customer of the
        payer sees it from its creation, with its fee, its maker and, once it
        has failed, the reason. The fee is what the payer pays on top of the
        amount when the payment settles, and it is zero for an internal
        payment (FEE-1, FEE-3). The customer of the payee sees an internal
        payment only once it is settled and an inbound one from its arrival,
        and it never sees the fee or the maker (PAY-15). An account of the
        platform shows with its account number, and with its identifier only
        to the customer that owns it. A payee outside the platform shows with
        its alias, its name and its participant (NET-2), and a payer outside
        with its name and its participant.
      additionalProperties: false
      required:
        - paymentId
        - endToEndId
        - kind
        - state
        - side
        - amount
        - createdAt
      properties:
        paymentId:
          $ref: "#/components/schemas/PaymentId"
        endToEndId:
          $ref: "../common/components.yaml#/components/schemas/EndToEndId"
        kind:
          $ref: "#/components/schemas/PaymentKind"
        state:
          $ref: "#/components/schemas/PaymentState"
        side:
          $ref: "#/components/schemas/PaymentSide"
        amount:
          $ref: "../common/components.yaml#/components/schemas/Money"
        fee:
          $ref: "../common/components.yaml#/components/schemas/Money"
        payerAccountId:
          $ref: "../common/components.yaml#/components/schemas/AccountId"
        payerAccountNumber:
          $ref: "../common/components.yaml#/components/schemas/AccountNumber"
        payerName:
          $ref: "../common/components.yaml#/components/schemas/PartyName"
        payerParticipant:
          $ref: "../common/components.yaml#/components/schemas/Participant"
        payeeAccountId:
          $ref: "../common/components.yaml#/components/schemas/AccountId"
        payeeAccountNumber:
          $ref: "../common/components.yaml#/components/schemas/AccountNumber"
        payeeAlias:
          $ref: "../common/components.yaml#/components/schemas/Alias"
        payeeName:
          $ref: "../common/components.yaml#/components/schemas/PartyName"
        payeeParticipant:
          $ref: "../common/components.yaml#/components/schemas/Participant"
        madeBy:
          $ref: "#/components/schemas/UserId"
        failureReason:
          $ref: "#/components/schemas/FailureReason"
        networkReason:
          $ref: "../common/components.yaml#/components/schemas/NetworkReason"
        createdAt:
          type: string
          format: date-time
          description: When the payment was created, in UTC. The 24 hours of APR-5 count from it.
          examples:
            - "2026-11-25T18:30:00Z"
    PaymentPage:
      type: object
      description: One page of the list of payments.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The payments of the page.
          items:
            $ref: "#/components/schemas/Payment"
          examples:
            - - paymentId: 2d9e4f6a-8b1c-4d3e-a5f6-0718293a4b5c
                endToEndId: E87654321202611251705Zx9Yw8Vu7Ts
                kind: INBOUND
                state: SETTLED
                side: PAYEE
                amount:
                  amount: "75.00"
                  currency: BRL
                payerName: Mercado Sol Ltda
                payerParticipant: "87654321"
                payeeAccountId: 9b2f7c1e-3a54-4d0b-8f6e-5c1a2b3d4e5f
                payeeAccountNumber: "48213907"
                createdAt: "2026-11-25T17:05:12Z"
        nextCursor:
          $ref: "../common/components.yaml#/components/schemas/NextCursor"
    Decision:
      type: string
      description: >-
        What a checker decides. APPROVED lets the payment start processing.
        REJECTED ends it.
      enum:
        - APPROVED
        - REJECTED
      examples:
        - APPROVED
    PaymentDecision:
      type: object
      description: What a checker sends to decide a payment.
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          $ref: "#/components/schemas/Decision"
    ActorKind:
      type: string
      description: >-
        Who can cause an audit event. USER is the maker or the checker whose
        request did it. CLEARING_NETWORK is the network, with a delivery or
        an answer. PLATFORM is the platform itself, when it settles, fails or
        expires a payment by its own rules.
      enum:
        - USER
        - CLEARING_NETWORK
        - PLATFORM
      examples:
        - USER
    Actor:
      type: object
      description: Who caused an audit event (AUD-2). Only a user has an identifier here.
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          $ref: "#/components/schemas/ActorKind"
        userId:
          $ref: "#/components/schemas/UserId"
    PaymentEvent:
      type: object
      description: >-
        The record of one thing that happened to a payment: its creation, or
        a change of its state (AUD-1). It shows the state that the payment
        entered, who caused that and the correlation ID of the request that
        did (AUD-2). An event that no request caused, such as an expiry, has
        a correlation ID that the service started. An event is never changed
        and never deleted (AUD-3).
      additionalProperties: false
      required:
        - sequence
        - state
        - occurredAt
        - actor
        - correlationId
      properties:
        sequence:
          type: integer
          description: >-
            The place of the event in the trail of its payment. The first
            event has 1, and each next one has one more.
          minimum: 1
          examples:
            - 1
        state:
          $ref: "#/components/schemas/PaymentState"
        occurredAt:
          type: string
          format: date-time
          description: >-
            When it happened, in UTC. On a clock that stands still, several
            events carry the same time, and the sequence gives their order.
          examples:
            - "2026-11-25T19:00:00Z"
        actor:
          $ref: "#/components/schemas/Actor"
        correlationId:
          $ref: "../common/components.yaml#/components/schemas/CorrelationId"
    PaymentEventPage:
      type: object
      description: One page of the audit trail of a payment.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The audit events of the page.
          items:
            $ref: "#/components/schemas/PaymentEvent"
          examples:
            - - sequence: 1
                state: SETTLED
                occurredAt: "2026-11-25T17:05:12Z"
                actor:
                  kind: CLEARING_NETWORK
                correlationId: 3e9a8b7c6d5e4f30a1b2c3d4e5f60718
        nextCursor:
          $ref: "../common/components.yaml#/components/schemas/NextCursor"
    AccountLimits:
      type: object
      description: >-
        The limits of an account (LIM-1) and what it has paid out. The day
        total and the night total count the internal and the outbound
        payments that started processing in the current day or night and
        have not failed, each with its amount and without its fee (LIM-5,
        LIM-6). Days and nights follow the time zone America/Sao_Paulo
        (TIM-2). Outside a night, there is no night total.
      additionalProperties: false
      required:
        - paymentLimit
        - dailyLimit
        - nightLimit
        - dayTotal
      properties:
        paymentLimit:
          $ref: "../common/components.yaml#/components/schemas/Money"
        dailyLimit:
          $ref: "../common/components.yaml#/components/schemas/Money"
        nightLimit:
          $ref: "../common/components.yaml#/components/schemas/Money"
        dayTotal:
          $ref: "../common/components.yaml#/components/schemas/Money"
        nightTotal:
          $ref: "../common/components.yaml#/components/schemas/Money"
    InboundDelivery:
      type: object
      description: What the clearing network sends to deliver an inbound payment.
      additionalProperties: false
      required:
        - amount
        - payeeAccountNumber
        - payerName
        - payerParticipant
      properties:
        amount:
          $ref: "../common/components.yaml#/components/schemas/Money"
        payeeAccountNumber:
          $ref: "../common/components.yaml#/components/schemas/AccountNumber"
        payerName:
          $ref: "../common/components.yaml#/components/schemas/PartyName"
        payerParticipant:
          $ref: "../common/components.yaml#/components/schemas/Participant"
    NetworkAnswer:
      description: >-
        The final answer of the clearing network for an outbound payment. Its
        outcome says which of the two forms it has.
      oneOf:
        - $ref: "#/components/schemas/SettledAnswer"
        - $ref: "#/components/schemas/RefusedAnswer"
      discriminator:
        propertyName: outcome
        mapping:
          SETTLED: "#/components/schemas/SettledAnswer"
          REFUSED: "#/components/schemas/RefusedAnswer"
    SettledAnswer:
      type: object
      description: The answer for a payment that the network has settled.
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          type: string
          description: Says that the network has settled the payment.
          enum:
            - SETTLED
          examples:
            - SETTLED
    RefusedAnswer:
      type: object
      description: The answer for a payment that the network has refused, with its reason.
      additionalProperties: false
      required:
        - outcome
        - reason
      properties:
        outcome:
          type: string
          description: Says that the network has refused the payment.
          enum:
            - REFUSED
          examples:
            - REFUSED
        reason:
          $ref: "../common/components.yaml#/components/schemas/NetworkReason"
