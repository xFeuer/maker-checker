group=io.github.xfeuer.makerchecker
version=0.1.0-SNAPSHOT

# Without this line the daemon of the build gets 512 MiB of heap and 384 MiB of metaspace. A daemon that had run
# about ten builds ran out of metaspace.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=768m

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
