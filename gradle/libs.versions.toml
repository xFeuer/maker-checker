[versions]
allure-java = "3.1.1"
allure-report = "2.46.1"
assertj = "3.27.7"
jackson = "3.3.0"
junit = "6.1.3"
playwright = "1.65.0"
slf4j = "2.0.20"
spotless = "8.11.0"
spring-boot = "4.1.2"

[libraries]
allure-bom = { module = "io.qameta.allure:allure-bom", version.ref = "allure-java" }
allure-commandline = { module = "io.qameta.allure:allure-commandline", version.ref = "allure-report" }
allure-java-commons = { module = "io.qameta.allure:allure-java-commons" }
allure-jupiter = { module = "io.qameta.allure:allure-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
